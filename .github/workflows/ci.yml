name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm test
      - run: python scripts/privacy_check.py --git
      - name: Download separately licensed test dependency
        run: curl --fail --location --retry 2 https://github.com/logisim-evolution/logisim-evolution/releases/download/v3.9.0/logisim-evolution-3.9.0-all.jar -o "$RUNNER_TEMP/logisim.jar"
      - run: npm run build
        env:
          LOGISIM_JAR: ${{ runner.temp }}/logisim.jar
      - run: npm run test:integration
        env:
          LOGISIM_JAR: ${{ runner.temp }}/logisim.jar
          LOGISIM_HEADLESS: 'true'
